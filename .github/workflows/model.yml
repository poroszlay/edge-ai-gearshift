name: INT8 model pipeline
on: [push, pull_request]
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/evidence/issue-6/requirements-lock.txt
      - run: python -m pip install -r docs/evidence/issue-6/requirements-lock.txt
      - run: |
          . tools/model-env.sh
          python -m unittest discover -s tests -p test_model.py -v
